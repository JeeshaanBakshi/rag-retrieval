<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Retrieval — Jeeshaan Singh Bakshi</title>
<meta name="description" content="Search a document by meaning: overlapping chunks, all-MiniLM-L6-v2 embeddings, cosine similarity, top 3.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=Newsreader:ital,opsz,wght@1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe6; --surface: #faf7f0; --ink: #121212; --muted: #4f4c47; --faint: #66625b;
    --line: #dcd3c4; --line-strong: #c0b6a4; --accent: #a63a0c; --orange: #e8651a; --danger: #a3261b;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.55 "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 720px; margin: 0 auto; padding: 56px 16px 64px; }
  .label { font: 500 0.6875rem/1.4 "JetBrains Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
  h1 { font-size: clamp(2.4rem, 9vw, 3.6rem); line-height: 1; letter-spacing: -0.04em; margin-top: 10px; }
  h1 em { font: italic 400 1em "Newsreader", Georgia, serif; color: var(--accent); }
  .lede { margin-top: 14px; color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  form { display: flex; gap: 8px; margin-top: 32px; }
  input { flex: 1; min-width: 0; font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); padding: 12px 14px; outline: none; }
  input:focus { border-color: var(--ink); }
  button { font: inherit; cursor: pointer; }
  .btn { background: var(--ink); color: var(--bg); border: 0; padding: 0 22px; font-weight: 500; }
  .btn:disabled { opacity: 0.6; cursor: progress; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: 0.75rem "JetBrains Mono", monospace; border: 1px solid var(--line); background: none; color: var(--muted); padding: 6px 9px; }
  .chip:hover { border-color: var(--ink); color: var(--ink); }

  #status { margin-top: 28px; font: 0.75rem "JetBrains Mono", monospace; color: var(--faint); }
  #status.error { color: var(--danger); }
  ol { list-style: none; padding: 0; margin-top: 8px; border-top: 1px solid var(--line); }
  li { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr); gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .score { font: 500 0.9375rem "JetBrains Mono", monospace; color: var(--accent); }
  .bar { height: 2px; background: var(--line); margin-top: 6px; }
  .bar span { display: block; height: 100%; background: var(--orange); }
  .passage { font: italic 1.15rem/1.45 "Newsreader", Georgia, serif; }

  footer { margin-top: 48px; font-size: 0.8125rem; color: var(--faint); }
  footer a { color: inherit; text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="label">RAG retrieval · Python</p>
  <h1>Search a document <em>by meaning.</em></h1>
  <p class="lede">Chunk → embed with all-MiniLM-L6-v2 → cosine similarity → top 3. Ask the NeRF article a question.</p>

  <form id="ask" role="search">
    <input id="q" type="search" placeholder="Ask a question…" aria-label="Question" autocomplete="off">
    <button class="btn" id="go" type="submit">Search</button>
  </form>
  <div class="chips" id="examples">
    <button class="chip" type="button">How does NeRF represent a 3D scene?</button>
    <button class="chip" type="button">What is volumetric rendering?</button>
  </div>

  <p id="status" aria-live="polite"></p>
  <ol id="results"></ol>

  <footer>
    By <a href="https://jeeshaanbakshi.vercel.app">Jeeshaan Singh Bakshi</a> · results are passages from the document, not generated text.
  </footer>
</main>

<script>
  const q = document.getElementById("q"), go = document.getElementById("go");
  const status = document.getElementById("status"), results = document.getElementById("results");
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  document.getElementById("examples").addEventListener("click", (e) => {
    if (e.target.matches("button")) { q.value = e.target.textContent; search(); }
  });
  document.getElementById("ask").addEventListener("submit", (e) => { e.preventDefault(); search(); });

  async function search() {
    const question = q.value.trim();
    if (!question) { status.textContent = "Type a question first."; status.className = "error"; return; }
    go.disabled = true; status.className = ""; status.textContent = "Searching…";
    try {
      const res = await fetch("/api/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, size: 100, overlap: 40 }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Search failed.");
      status.textContent = `Top 3 of ${data.log.total_chunks} chunks`;
      results.innerHTML = data.highl.map((h) => `
        <li>
          <div><div class="score">${h.score.toFixed(3)}</div><div class="bar"><span style="width:${Math.max(0, h.score) * 100}%"></span></div></div>
          <p class="passage">${esc(h.text.trim())}</p>
        </li>`).join("");
    } catch (err) {
      status.textContent = err.message; status.className = "error";
    } finally {
      go.disabled = false;
    }
  }
</script>
</body>
</html>
